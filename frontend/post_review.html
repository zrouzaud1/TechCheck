<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Review</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Post Your Review</h1>
    </header>

    <nav class="navbar">
        <button class="nav-item" onclick="goHome()">Home</button>
        <button class="nav-item" onclick="openSearch()">Search</button>
        <button class="nav-item" onclick="signUp()">Sign Up</button>
    </nav>

    <section>
        <h2>Submit a Review</h2>
        <form id="reviewForm">
            <label for="productName">Product Name:</label>
            <input type="text" id="productName" required><br><br>

            <label for="review">Your Review:</label>
            <textarea id="review" rows="4" required></textarea><br><br>

            <button type="submit">Submit Review</button>
        </form>
        <p id="reviewResponse"></p>
    </section>

    <script>
        // Handle form submission
        document.getElementById('reviewForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const productName = document.getElementById('productName').value;
            const review = document.getElementById('review').value;

            // Send POST request to /addReview endpoint
            fetch('http://localhost:8080/addReview', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `productName=${encodeURIComponent(productName)}&review=${encodeURIComponent(review)}`
            })
            .then(response => response.text())
            .then(data => {
                document.getElementById('reviewResponse').innerText = data;
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('reviewResponse').innerText = "Failed to submit review.";
            });
        });
    </script>
</body>
</html>
