<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Review</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Post Your Review</h1>
    </header>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <button class="nav-item" onclick="goHome()">Home</button>
        <input type="text" id="navbarSearchInput" placeholder="Search Product" onkeyup="key_up(event)" />
        <button id="searchBtn" onclick="submitSearch()">Search</button>
        <button id="openSignupBtn" class="nav-item">Sign Up</button>
    </nav>

    <section>
        <h2>Submit a Review</h2>
        <form id="reviewForm">
            <label for="productName">Product Name:</label>
            <input type="text" id="productName" required><br><br>

            <label for="review">Your Review:</label>
            <textarea id="review" rows="4" required></textarea><br><br>

            <button type="submit">Submit Review</button>
        </form>
        <p id="reviewResponse"></p>
    </section>

    <!-- Signup Popup -->
    <div id="signupPopup" style="display: none;">
        <div class="popup-content">
            <span class="signup-close-btn" onclick="closeSignup()">&times;</span>
            <h2>Sign Up</h2>
            <form>
                <label for="username">Username:</label>
                <input type="text" id="username" required><br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" required><br><br>
                <label for="password">Password:</label>
                <input type="password" id="password" required><br><br>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
