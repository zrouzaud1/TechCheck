<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Check</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Tech Check</h1>
    </header>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <button class="nav-item" onclick="goHome()">Home</button>
        <input type="text" id="navbarSearchInput" placeholder="Search Product" onkeyup="key_up(event)" />
        <button id="searchBtn" onclick="submitSearch()">Search</button>
        <button id="openSignupBtn" class="nav-item">Sign Up</button>
        <button class="nav-item" onclick="postReview()">Post Review</button>
    </nav>
    
    <p>This is a simple button to show the connection to our MySQL database using JDBC.</p>
    <button onclick="fetchData()">Fetch Data from Java Backend</button>

    <p id="response"></p>
    
    <!-- Search Pop-up -->
    <div id="searchPopup" class="search-popup">
        <div class="popup-content">
            <span class="close-btn" onclick="closeSearch()">&times;</span>
            <input type="text" id="popupSearchInput" placeholder="Search..." class="search-input">
            <button class="search-btn" onclick="submitSearch()">Search</button>
        </div>
    </div>

    <!-- Signup Popup -->
    <div id="signupPopup" style="display: none;">
        <div class="popup-content">
            <span class="signup-close-btn" onclick="closeSignup()">&times;</span>
            <h2>Sign Up</h2>
            <form>
                <label for="username">Username:</label>
                <input type="text" id="username" required><br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" required><br><br>
                <label for="password">Password:</label>
                <input type="password" id="password" required><br><br>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
